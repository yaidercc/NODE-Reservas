openapi: 3.0.0
info:
  title: Reservation Api
  summary: Summary.
  description: Description.
  version: 0.2.0
servers:
  - url: 'http://localhost:4000/api'
    description: Staging server
security:
  - ApiKeyAuth: []
tags:
  - name: Users
    description: Module in which you can manage everything related to Users
  - name: Rooms
    description: Module in which you can manage everything related to Rooms
  - name: Reservations
    description: Module in which you can manage everything related to Rooms
paths:
  /users:
    get:
      tags:
        - Users
      summary: Get users collection
      description: Get all users from the database
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      allOf:
                        - type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              example: 5b090fbb-926e-4997-9242-12fa7847bf5b
                            role:
                              type: string
                              example: admin
                        - type: object
                          properties:
                            name:
                              type: string
                              example: jon
                            last_name:
                              type: string
                              example: Doe
                            email:
                              type: string
                              example: jonDoe@gmail.com
                        - type: object
                          properties:
                            created_at:
                              type: string
                              format: date-time
                            created_by:
                              type: string
                              format: uuid
                        - type: object
                          properties:
                            updated_at:
                              type: string
                              format: date-time
                              nullable: true
                            updated_by:
                              type: string
                              format: uuid
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Not found
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unexpected error occurred
    post:
      tags:
        - Users
      summary: Create a user instance
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      example: 5b090fbb-926e-4997-9242-12fa7847bf5b
                    password:
                      type: string
                      example: JonDoe123*
                - type: object
                  properties:
                    name:
                      type: string
                      example: jon
                    last_name:
                      type: string
                      example: Doe
                    email:
                      type: string
                      example: jonDoe@gmail.com
      responses:
        '201':
          description: user instance created succesfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Resource(s) created
                  data:
                    type: object
                  metadata:
                    type: object
        '400':
          description: Validation fails
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Validations fail
                  data:
                    type: object
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: id
                        message:
                          type: string
                          example: '"id" is required'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Not found
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unexpected error occurred
  '/users/{id}':
    get:
      tags:
        - Users
      summary: Fetch an user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          descripcion: Return an user instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success
                  data:
                    allOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            example: 5b090fbb-926e-4997-9242-12fa7847bf5b
                          role:
                            type: string
                            example: admin
                      - type: object
                        properties:
                          name:
                            type: string
                            example: jon
                          last_name:
                            type: string
                            example: Doe
                          email:
                            type: string
                            example: jonDoe@gmail.com
                      - type: object
                        properties:
                          created_at:
                            type: string
                            format: date-time
                          created_by:
                            type: string
                            format: uuid
                      - type: object
                        properties:
                          updated_at:
                            type: string
                            format: date-time
                            nullable: true
                          updated_by:
                            type: string
                            format: uuid
        '400':
          description: Validation fails
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Validations fail
                  data:
                    type: object
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: id
                        message:
                          type: string
                          example: '"id" is required'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Not found
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unexpected error occurred
    post:
      tags:
        - Users
      summary: Update an user instance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    name:
                      type: string
                      example: jon
                    last_name:
                      type: string
                      example: Doe
                    email:
                      type: string
                      example: jonDoe@gmail.com
                - type: object
                  properties:
                    updated_at:
                      type: string
                      format: date-time
                      nullable: true
                    updated_by:
                      type: string
                      format: uuid
      responses:
        '200':
          description: user instance updated succesfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                  metadata:
                    type: object
        '400':
          description: Validation fails
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Validations fail
                  data:
                    type: object
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: id
                        message:
                          type: string
                          example: '"id" is required'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Not found
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unexpected error occurred
    delete:
      tags:
        - Users
      summary: Delete an user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          descripcion: Delete an user instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success
        '400':
          description: Validation fails
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Validations fail
                  data:
                    type: object
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: id
                        message:
                          type: string
                          example: '"id" is required'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Not found
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unexpected error occurred
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-token
